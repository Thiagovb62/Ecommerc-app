<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ecommerce</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn-login {
            width: 100%;
            background: #3498db;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background: #2980b9;
        }
        .btn-cadastrar {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-cadastrar:hover {
            opacity: 0.9;
        }
        .erro {
            background: #e74c3c;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h2><i class="fas fa-store"></i> Meu Ecommerce</h2>
            <div id="erro-mensagem" class="erro" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="email@exemplo.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <button id="btn-cadastrar" class="btn-cadastrar">Criar Conta</button>
        </div>
    </div>

    <script>
        const API_URL = '';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/api/users`);
                const users = await response.json();
                
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    localStorage.setItem('userId', user.id);
                    localStorage.setItem('userName', user.name);
                    window.location.href = '/';
                } else {
                    mostrarErro('Email ou senha incorretos');
                }
            } catch (error) {
                mostrarErro('Erro ao fazer login. Tente novamente.');
            }
        });
        
        document.getElementById('btn-cadastrar').addEventListener('click', () => {
            window.location.href = '/cadastro.html';
        });
        
        function mostrarErro(msg) {
            const erroDiv = document.getElementById('erro-mensagem');
            erroDiv.textContent = msg;
            erroDiv.style.display = 'block';
            setTimeout(() => {
                erroDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
